Section "Device"
	Identifier  "MediaTek Display Controller"
	Driver      "modesetting"
	BusID       "platform:mediatek-drm.7.auto:00"
	Option      "kmsdev" "/dev/dri/card0"
	Option      "DRI" "3"
	Option      "PageFlip" "false"
	Option      "TearFree" "true"
	Option      "SwapbuffersWait" "false"
EndSection
Section "Device"
	Identifier  "PowerVR GX6250"
	Driver      "modesetting"
	BusID       "platform:13000000.gpu:00"
	Option      "kmsdev" "/dev/dri/card1"
	Option      "DRI" "3"
	Option      "TearFree" "true"
EndSection
Section "Screen"
	Identifier  "Default Screen"
	Device      "MediaTek Display Controller"
EndSection
Section "ServerLayout"
	Identifier  "Default Layout"
	Screen      "Default Screen"
EndSection
