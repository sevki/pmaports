# Record from the built-in microphone as S16LE.
#
# The capture PCM (MultiMedia2) advertises S24_LE as well as S16_LE, but its
# S24_LE samples do not fit the 24-bit range: a quiet room captured raw with
# arecord peaks at ~930% of 24-bit full scale, where S16_LE from the same
# device peaks around 6%. Anything that trusts the 24-bit framing saturates and
# the recording is crackle. Pinning the node to S16LE avoids that.
#
# Playback needs no rule here: 52-fairphone-fp4.conf already pins the sink to
# S32LE.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = {
      update-props = {
        audio.format   = "S16LE"
        audio.rate     = 48000
        audio.channels = 2
        audio.position = "FL,FR"
        api.alsa.period-size = 960
        api.alsa.headroom    = 1024
        api.alsa.disable-batch = true
      }
    }
  }
]
