[LightDM]
logind-check-graphical=false

[Seat:*]
user-session=xfce
xserver-command=/usr/libexec/Xorg -sharevts -keeptty
# Alpine bubblewrap omits the openat2 fallback needed by this 4.4 kernel.
greeter-wrapper=/usr/bin/honor6x-lightdm-greeter-wrapper
session-wrapper=/usr/bin/honor6x-lightdm-session-wrapper
display-setup-script=/usr/bin/honor6x-display-setup
allow-guest=false
